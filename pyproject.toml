[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nuro"
version = "0.1.0"
description = "CLI productivity tool for task and habit management."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.11.7",
    "rich>=14.1.0",
    "tinydb>=4.8.2",
    "typer>=0.16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[project.scripts]
nuro = "nuro.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["nuro*"]

[tool.uv]
package = true
